[project]
name = "lost-source-revival"
version = "0.1.0"
description = "FOSS decompilation factory: BYOD binary -> matching C -> verified compilable targets/<slug>/ (games, apps, firmware — any lost source)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # engine/tools are stdlib-only by design

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
