[project]
name = "lost-source-revival"
version = "0.1.0"
description = "FOSS decompilation factory: BYOD binary -> matching C -> verified compilable targets/<slug>/ (games, apps, firmware — any lost source)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # engine/tools are stdlib-only by design

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.9"]
training = [
    "torch>=2.4",
    "transformers>=4.46,<5",
    "peft>=0.15,<1",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
]
experiments = [
    "mlflow>=3.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
