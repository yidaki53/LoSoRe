name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install -e ".[dev]"
      - run: make lint
      - run: make typecheck
      - run: python3 -m pytest tests/ -q
      - run: python3 run_verification.py --target liero --oracle dat-parity
      - name: Assert no false source verification
        run: python3 -c "import json; d=json.load(open('recovery_results.json')); assert d['schema_version']==2 and d['verified_functions']==[]"
